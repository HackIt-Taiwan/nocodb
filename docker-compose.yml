version: "3.9"

services:
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nocodb:
    build:
      context: ./packages/nocodb
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      NC_DB: ${NC_DB:?set to your external DB, e.g. pg://user:pass@host:5432/dbname}
      NC_REDIS_URL: ${NC_REDIS_URL:-redis://redis:6379/0}
      NC_PUBLIC_URL: ${NC_PUBLIC_URL:-http://localhost:8010}
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:-changeme_jwt_secret}
      NC_DISABLE_EMAIL_AUTH: ${NC_DISABLE_EMAIL_AUTH:-true}
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:-admin@example.com}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-Passw0rd!}
      NC_S3_BUCKET_NAME: ${NC_S3_BUCKET_NAME:-}
      NC_S3_REGION: ${NC_S3_REGION:-}
      NC_S3_ENDPOINT: ${NC_S3_ENDPOINT:-}
      NC_S3_ACCESS_KEY: ${NC_S3_ACCESS_KEY:-}
      NC_S3_ACCESS_SECRET: ${NC_S3_ACCESS_SECRET:-}
      NC_S3_FORCE_PATH_STYLE: ${NC_S3_FORCE_PATH_STYLE:-false}
      NC_S3_ACL: ${NC_S3_ACL:-}
      NC_ATTACHMENT_FIELD_SIZE: ${NC_ATTACHMENT_FIELD_SIZE:-20971520}
      NC_NON_ATTACHMENT_FIELD_SIZE: ${NC_NON_ATTACHMENT_FIELD_SIZE:-1048576}
      NC_MAX_ATTACHMENTS_ALLOWED: ${NC_MAX_ATTACHMENTS_ALLOWED:-10}
      NC_ATTACHMENT_RETENTION_DAYS: ${NC_ATTACHMENT_RETENTION_DAYS:-10}
      NC_SECURE_ATTACHMENTS: ${NC_SECURE_ATTACHMENTS:-false}
      NC_ATTACHMENT_EXPIRE_SECONDS: ${NC_ATTACHMENT_EXPIRE_SECONDS:-7200}
      NC_SMTP_FROM: ${NC_SMTP_FROM:-}
      NC_SMTP_HOST: ${NC_SMTP_HOST:-}
      NC_SMTP_PORT: ${NC_SMTP_PORT:-}
      NC_SMTP_USERNAME: ${NC_SMTP_USERNAME:-}
      NC_SMTP_PASSWORD: ${NC_SMTP_PASSWORD:-}
      NC_SMTP_SECURE: ${NC_SMTP_SECURE:-false}
      NC_SMTP_IGNORE_TLS: ${NC_SMTP_IGNORE_TLS:-false}
      NC_SMTP_REJECT_UNAUTHORIZED: ${NC_SMTP_REJECT_UNAUTHORIZED:-false}
      NC_DB_JSON: ${NC_DB_JSON:-}
      NC_DB_JSON_FILE: ${NC_DB_JSON_FILE:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      NC_CONNECTION_ENCRYPT_KEY: ${NC_CONNECTION_ENCRYPT_KEY:-}
      NC_JWT_EXPIRES_IN: ${NC_JWT_EXPIRES_IN:-10h}
      NC_GOOGLE_CLIENT_ID: ${NC_GOOGLE_CLIENT_ID:-}
      NC_GOOGLE_CLIENT_SECRET: ${NC_GOOGLE_CLIENT_SECRET:-}
      NC_DISABLE_PG_DATA_REFLECTION: ${NC_DISABLE_PG_DATA_REFLECTION:-false}
      NC_MIGRATIONS_DISABLED: ${NC_MIGRATIONS_DISABLED:-false}
      NC_DISABLE_AUDIT: ${NC_DISABLE_AUDIT:-false}
      NC_AUTOMATION_LOG_LEVEL: ${NC_AUTOMATION_LOG_LEVEL:-OFF}
      NC_IFRAME_WHITELIST_DOMAINS: ${NC_IFRAME_WHITELIST_DOMAINS:-}
      NC_DISABLE_TELE: ${NC_DISABLE_TELE:-true}
      NC_DISABLE_SUPPORT_CHAT: ${NC_DISABLE_SUPPORT_CHAT:-false}
      NC_TOOL_DIR: ${NC_TOOL_DIR:-/usr/app/data}
      NC_DASHBOARD_URL: ${NC_DASHBOARD_URL:-/dashboard}
      NUXT_PUBLIC_NC_BACKEND_URL: ${NUXT_PUBLIC_NC_BACKEND_URL:-http://localhost:8010}
      PASSPORT_API_BASE_URL: ${PASSPORT_API_BASE_URL:-}
      PASSPORT_API_TOKEN: ${PASSPORT_API_TOKEN:-}
      PASSPORT_CLIENT_ID: ${PASSPORT_CLIENT_ID:-[one]outline}
      PORT: ${PORT:-8010}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8010}:${PORT:-8010}"
    command: ["/usr/src/appEntry/start.sh"]
    volumes:
      - nocodb_data:/usr/app/data
      - /opt/do/certs/ca-certificate.crt:/certs/ca-certificate.crt:ro

volumes:
  redis_data:
  nocodb_data:
